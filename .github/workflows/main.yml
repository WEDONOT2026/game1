name: 打包 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y \
            python3-pip \
            git \
            zlib1g-dev \
            libncurses5 \
            libstdc++-9-dev \
            libtinfo5

      - name: 安装 Buildozer
        run: |
          pip3 install --upgrade pip
          pip3 install buildozer cython

      - name: 初始化 Buildozer
        run: buildozer init || true

      - name: 打包 APK
        run: buildozer -v android debug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: game3-apk
          path: bin/*.apk
