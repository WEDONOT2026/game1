
name: 打包 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装系统依赖
        run: |
          sudo apt update
          sudo apt install -y \
            python3-pip \
            git \
            zlib1g-dev \
            libncurses5 \
            libtinfo5 \
            libstdc++-9-dev \
            autoconf \
            libtool \
            pkg-config

      - name: 安装 Buildozer
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install buildozer cython

      - name: 初始化 Buildozer
        run: buildozer init || true

      - name: 打包 APK
        run: buildozer -v android debug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: game3-apk
          path: bin/*.apk
